" y="330" text-anchor="start" font-size="17" font-weight="700" fill="#141414" >Previous decoder layer</text><text x="46" y="356" text-anchor="start" font-size="17" font-weight="400" fill="#141414" >provides probabilities over</text><text x="46" y="379" text-anchor="start" font-size="17" font-weight="400" fill="#141414" >the four box boundaries.</text><text x="46" y="435" text-anchor="start" font-size="16" font-weight="400" fill="#515151" >A and B illustrate two</text><text x="46" y="457" text-anchor="start" font-size="16" font-weight="400" fill="#515151" >of the possible regions.</text><rect x="308" y="77" width="395" height="440" rx="0" fill="#d9f2d0" stroke="none" stroke-width="1.4"/><text x="324" y="113" text-anchor="start" font-size="21" font-weight="700" fill="#141414" >Selective state on a feature row</text><text x="324" y="147" text-anchor="start" font-size="15" font-weight="400" fill="#515151" >start</text><text x="624" y="147" text-anchor="start" font-size="15" font-weight="400" fill="#515151" >end</text><path d="M367 143H612" fill="none" stroke="#2d632f" stroke-width="1.8" marker-end="url(#a2d632f)"/><text x="323" y="199" text-anchor="start" font-size="16" font-weight="700" fill="#126c9e" >A</text><text x="381" y="199" text-anchor="middle" font-size="17" font-weight="700" fill="#141414" font-family="Cambria, Georgia, serif" font-style="italic">0</text><path d="M392 194H411" fill="none" stroke="#126c9e" stroke-width="1.8" marker-end="url(#a126c9e)"/><rect x="414" y="181" width="23" height="25" rx="0" fill="#c6d9e6" stroke="white" stroke-width="1.4"/><path d="M438 194h11" fill="none" stroke="#126c9e" stroke-width="1.8" marker-end="url(#a126c9e)"/><rect x="451" y="181" width="23" height="25" rx="0" fill="#9cbfd3" stroke="white" stroke-width="1.4"/><path d="M475 194h11" fill="none" stroke="#126c9e" stroke-width="1.8" marker-end="url(#a126c9e)"/><rect x="488" y="181" width="23" height="25" rx="0" fill="#c6d9e6" stroke="white" stroke-width="1.4"/><path d="M512 194h11" fill="none" stroke="#126c9e" stroke-width="1.8" marker-end="url(#a126c9e)"/><rect x="525" y="181" width="23" height="25" rx="0" fill="#9cbfd3" stroke="white" stroke-width="1.4"/><path d="M549 194h11" fill="none" stroke="#126c9e" stroke-width="1.8" marker-end="url(#a126c9e)"/><rect x="562" y="181" width="23" height="25" rx="0" fill="#c6d9e6" stroke="white" stroke-width="1.4"/><path d="M586 194h11" fill="none" stroke="#126c9e" stroke-width="1.8" marker-end="url(#a126c9e)"/><text x="616" y="200" text-anchor="middle" font-size="21" font-weight="700" fill="#126c9e" font-family="Cambria, Georgia, serif" font-style="italic">h</text><text x="323" y="262" text-anchor="start" font-size="16" font-weight="700" fill="#a24f20" >B</text><text x="381" y="262" text-anchor="middle" font-size="17" font-weight="700" fill="#141414" font-family="Cambria, Georgia, serif" font-style="italic">0</text><path d="M392 257H411" fill="none" stroke="#a24f20" stroke-width="1.8" marker-end="url(#aa24f20)"/><rect x="414" y="244" width="23" height="25" rx="0" fill="#c6d9e6" stroke="white" stroke-width="1.4"/><path d="M438 257h11" fill="none" stroke="#a24f20" stroke-width="1.8" marker-end="url(#aa24f20)"/><rect x="451" y="244" width="23" height="25" rx="0" fill="#9cbfd3" stroke="white" stroke-width="1.4"/><path d="M475 257h11" fill="none" stroke="#a24f20" stroke-width="1.8" marker-end="url(#aa24f20)"/><rect x="488" y="244" width="23" height="25" rx="0" fill="#c6d9e6" stroke="white" stroke-width="1.4"/><path d="M512 257h11" fill="none" stroke="#a24f20" stroke-width="1.8" marker-end="url(#aa24f20)"/><rect x="525" y="244" width="23" height="25" rx="0" fill="#9cbfd3" stroke="white" stroke-width="1.4"/><path d="M549 257h11" fill="none" stroke="#a24f20" stroke-width="1.8" marker-end="url(#aa24f20)"/><text x="578" y="263" text-anchor="middle" font-size="21" font-weight="700" fill="#a24f20" font-family="Cambria, Georgia, serif" font-style="italic">h</text><text x="329" y="316" text-anchor="start" font-size="17" font-weight="400" fill="#141414" >Start from zero, then retain prior state</text><text x="329" y="339" text-anchor="start" font-size="17" font-weight="400" fill="#141414" >and write content at each valid cell.</text><text x="329" y="375" text-anchor="start" font-size="23" font-weight="700" fill="#141414" font-family="Cambria, Georgia, serif" font-style="italic">hₜ = aₜ ⊙ hₜ₋₁ + bₜ</text><rect x="718" y="77" width="296" height="440" rx="0" fill="#f4f5f5" stroke="none" stroke-width="1.4"/><text x="735" y="113" text-anchor="start" font-size="21" font-weight="700" fill="#141414" >Readout for one query</text><rect x="736" y="154" width="258" height="42" rx="0" fill="white" stroke="none" stroke-width="1.4"/><text x="865.0" y="180.61" text-anchor="middle" font-size="17" font-weight="400" fill="#141414" >Mean of row-end states</text><path d="M865 198V225" fill="none" stroke="#2d632f" stroke-width="1.8" marker-end="url(#a2d632f)"/><rect x="736" y="228" width="258" height="45" rx="0" fill="#d9f2d0" stroke="none" stroke-width="1.4"/><text x="865.0" y="255.78" text-anchor="middle" font-size="16" font-weight="700" fill="#141414" >Weight by region probability</text><text x="865" y="312" text-anchor="middle" font-size="24" font-weight="700" fill="#141414" font-family="Cambria, Georgia, serif" font-style="italic">s = ∑ p(R) · s(R)</text><text x="865" y="344" text-anchor="middle" font-size="16" font-weight="400" fill="#515151" >Sum over valid rectangles R.</text><rect x="326" y="409" width="358" height="82" rx="0" fill="white" stroke="#aecaa7" stroke-width="1.4"/><text x="341" y="438" text-anchor="start" font-size="17" font-weight="700" fill="#141414" >Shared interval table</text><text x="341" y="464" text-anchor="start" font-size="17" font-weight="400" fill="#141414" >Compute once per feature level.</text><path d="M865 353V386" fill="none" stroke="#156082" stroke-width="1.8" marker-end="url(#a156082)"/><rect x="737" y="389" width="257" height="42" rx="0" fill="#0b76a0" stroke="none" stroke-width="1.4"/><text x="865.5" y="415.28" text-anchor="middle" font-size="16" font-weight="700" fill="white" >Project state into the query</text><text x="865" y="465" text-anchor="middle" font-size="20" font-weight="700" fill="#141414" font-family="Cambria, Georgia, serif" font-style="italic">q′ = q + correction</text><path d="M24 556H1016" fill="none" stroke="#d4d4d4" stroke-width="1"/><rect x="24" y="579" width="13" height="4" rx="0" fill="#126c9e" stroke="none" stroke-width="1.4"/><rect x="42" y="579" width="13" height="4" rx="0" fill="#126c9e" stroke="none" stroke-width="1.4"/><rect x="60" y="579" width="13" height="4" rx="0" fill="#126c9e" stroke="none" stroke-width="1.4"/><rect x="78" y="579" width="13" height="4" rx="0" fill="#126c9e" stroke="none" stroke-width="1.4"/><text x="111" y="586" text-anchor="start" font-size="19" font-weight="700" fill="#141414" >Share the interval table and update the original query.</text><text x="1010" y="586" text-anchor="end" font-size="17" font-weight="400" fill="#515151" >4 / 4</text></g></svg>
