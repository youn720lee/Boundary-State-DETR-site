ll="#fff" stroke="none" stroke-width="1.4"/><text x="569.5" y="256.11" text-anchor="middle" font-size="17" font-weight="400" fill="#141414" >Mean over rows</text><path d="M672 250H706" fill="none" stroke="#2d632f" stroke-width="1.8" marker-end="url(#a2d632f)"/><rect x="708" y="229" width="278" height="43" rx="0" fill="#fff" stroke="none" stroke-width="1.4"/><text x="847.0" y="256.11" text-anchor="middle" font-size="17" font-weight="400" fill="#141414" >Boundary-weighted state</text><text x="729" y="294" text-anchor="middle" font-size="16" font-weight="400" fill="#515151" >Interval states are shared across queries.</text><text x="449" y="350" text-anchor="start" font-size="22" font-weight="700" fill="#141414" font-family="Cambria, Georgia, serif" font-style="italic">Background intervention</text><rect x="444" y="364" width="570" height="166" rx="0" fill="#fbe3d6" stroke="none" stroke-width="1.4"/><text x="987" y="388" text-anchor="end" font-size="13" font-weight="700" fill="#a24f20" >TRAINING ONLY</text><rect x="468" y="403" width="145" height="40" rx="0" fill="white" stroke="none" stroke-width="1.4"/><text x="540.5" y="428.61" text-anchor="middle" font-size="17" font-weight="400" fill="#141414" >Edited view</text><path d="M615 423H665" fill="none" stroke="#a24f20" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#aa24f20)"/><text x="638" y="410" text-anchor="middle" font-size="18" font-weight="700" fill="#a24f20" font-family="Cambria, Georgia, serif" font-style="italic">Δ′</text><rect x="669" y="403" width="160" height="40" rx="0" fill="#d9f2d0" stroke="none" stroke-width="1.4"/><text x="749.0" y="428.61" text-anchor="middle" font-size="17" font-weight="700" fill="#141414" >Replay BCSA</text><text x="469" y="470" text-anchor="start" font-size="16" font-weight="400" fill="#515151" >Original query, content and geometry are reused.</text><path d="M831 423H857" fill="none" stroke="#a24f20" stroke-width="1.8" marker-end="url(#aa24f20)"/><rect x="859" y="403" width="131" height="40" rx="0" fill="#f3bb9b" stroke="none" stroke-width="1.4"/><text x="924.5" y="428.28" text-anchor="middle" font-size="16" font-weight="700" fill="#141414" >Prediction¹</text><text x="469" y="499" text-anchor="start" font-size="20" font-weight="700" fill="#141414" font-family="Cambria, Georgia, serif" font-style="italic">L = Ldet + λ Lhybrid</text><text x="663" y="500" text-anchor="start" font-size="15" font-weight="400" fill="#515151" >¹ Same head weights and targets.</text><text x="40" y="537" text-anchor="start" font-size="16" font-weight="700" fill="#156082" >Inference uses a single image.</text><path d="M24 556H1016" fill="none" stroke="#d4d4d4" stroke-width="1"/><rect x="24" y="579" width="13" height="4" rx="0" fill="#126c9e" stroke="none" stroke-width="1.4"/><rect x="42" y="579" width="13" height="4" rx="0" fill="#126c9e" stroke="none" stroke-width="1.4"/><rect x="60" y="579" width="13" height="4" rx="0" fill="#126c9e" stroke="none" stroke-width="1.4"/><rect x="78" y="579" width="13" height="4" rx="0" fill="#126c9e" stroke="none" stroke-width="1.4"/><rect x="96" y="579" width="13" height="4" rx="0" fill="#126c9e" stroke="none" stroke-width="1.4"/><rect x="114" y="579" width="13" height="4" rx="0" fill="#126c9e" stroke="none" stroke-width="1.4"/><text x="147" y="586" text-anchor="start" font-size="19" font-weight="700" fill="#141414" >Supervise both predictions on the same targets.</text><text x="1010" y="586" text-anchor="end" font-size="17" font-weight="400" fill="#515151" >6 / 6</text></g></svg>
